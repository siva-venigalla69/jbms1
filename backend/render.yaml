services:
  - type: web
    name: textile-printing-api
    env: python
    region: oregon
    plan: starter  # Upgraded for better performance
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      # Database Configuration
      - key: DATABASE_URL
        fromDatabase:
          name: textile-printing-db
          property: connectionString
      
      # Security Configuration  
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      
      # Application Configuration
      - key: APP_NAME
        value: "Digital Textile Printing Management System"
      - key: APP_VERSION
        value: "1.0.0"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      
      # CORS Configuration
      - key: CORS_ORIGINS
        value: "https://textile-printing-app.netlify.app"
      - key: FRONTEND_URL
        value: "https://textile-printing-app.netlify.app"
      
      # Rate Limiting
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_REQUESTS
        value: 100
      - key: RATE_LIMIT_WINDOW
        value: 3600
      
      # Logging Configuration
      - key: LOG_LEVEL
        value: INFO
      
      # Admin Configuration (will be changed after deployment)
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@textileprinting.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_FULL_NAME
        value: "System Administrator"
      
      # Performance Configuration
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_POOL_OVERFLOW
        value: 10
      - key: DB_POOL_TIMEOUT
        value: 30

databases:
  - name: textile-printing-db
    databaseName: textile_printing_db
    user: textile_user
    plan: starter 